<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Zero2Fit tuning review QA fixture</title></head>
<body>
<script>
(() => {
  const now = Date.now();
  const events = [];
  let sequence = 0;
  const add = (type, metadata = {}, offsetMinutes = 0) => {
    const at = now - offsetMinutes * 60000 - sequence * 61;
    sequence += 1;
    const observedAt = new Date(at).toISOString();
    events.push({ id:`qa-tuning-review-${sequence}`, type, observedAt, day:observedAt.slice(0,10), metadata });
  };

  add('guidance_shown',{action:'start_move'},30);
  add('guidance_shown',{action:'quick_workout'},29);
  add('guidance_shown',{action:'log_food'},28);
  add('guidance_shown',{action:'recovery_check'},27);
  add('guidance_acted',{action:'start_move'},26);

  for (let i=0;i<8;i++) add('workout_set_completed',{},25-i);
  for (let i=0;i<3;i++) add('workout_set_skipped',{},16-i);
  for (let i=0;i<3;i++) add('workout_substitute_selected',{intent:'horizontal_pull'},13-i);
  add('workout_target_edited',{kind:'load',method:'stepper'},10);
  add('workout_target_edited',{kind:'load',method:'manual'},9);
  add('workout_target_edited',{kind:'reps',method:'stepper'},8);
  add('workout_target_edited',{kind:'reps',method:'manual'},7);
  add('workout_rest_override',{method:'start_next'},7);
  add('workout_rest_override',{method:'start_next'},6);
  add('workout_rest_override',{method:'start_next'},6);
  add('workout_session_left',{outcome:'incomplete',source:'navigation'},6);
  add('workout_session_resumed',{outcome:'resumed',source:'navigation'},5);
  add('workout_session_left',{outcome:'incomplete',source:'background'},5);
  add('workout_session_left',{outcome:'incomplete',source:'navigation'},5);
  add('workout_mode_selected',{mode:'quick'},5);
  add('workout_mode_selected',{mode:'quick'},5);
  add('workout_mode_selected',{mode:'quick'},4);
  add('workout_mode_selected',{mode:'standard'},4);

  add('fuel_panel_closed',{outcome:'abandoned',method:'close_button'},4);
  add('fuel_panel_closed',{outcome:'abandoned',method:'backdrop'},4);
  add('fuel_panel_closed',{outcome:'abandoned',method:'escape'},4);
  add('fuel_panel_closed',{outcome:'logged',method:'close_button'},3);
  add('fuel_lookup_result',{method:'search',outcome:'success'},3);
  add('fuel_lookup_result',{method:'search',outcome:'empty'},3);
  add('fuel_lookup_result',{method:'barcode',outcome:'empty'},3);
  add('fuel_lookup_result',{method:'search',outcome:'error'},2);
  add('fuel_lookup_result',{method:'barcode',outcome:'error'},2);
  for (let i=0;i<5;i++) add('fuel_entry_logged',{method:'manual'},2);
  add('fuel_entry_logged',{method:'repeat'},1);
  add('fuel_entry_logged',{method:'saved'},1);

  add('manual_health_entry',{kind:'steps'},1);
  add('manual_health_entry',{kind:'weight'},1);
  add('manual_health_entry',{kind:'steps'},1);

  localStorage.setItem('zero2fit-usage-v1', JSON.stringify({ version:1, events, updatedAt:new Date(now).toISOString() }));
  localStorage.setItem('zero2fit-usage-settings-v1', JSON.stringify({ enabled:true, updatedAt:new Date(now).toISOString() }));
  const expanded = new URLSearchParams(location.search).get('mode') === 'expanded';
  location.replace(`./?qaPage=journey${expanded ? '&qaTuning=expanded' : ''}`);
})();
</script>
</body>
</html>
