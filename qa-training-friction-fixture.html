<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Zero2Fit training friction QA fixture</title></head>
<body>
<script>
(() => {
  const now = Date.now();
  const DAY_MS = 86400000;
  const events = [];
  let sequence = 0;
  const add = (type, metadata = {}, offsetMinutes = 0) => {
    const dayOffset = (sequence % 2) * DAY_MS;
    const at = now - dayOffset - offsetMinutes * 60000 - sequence * 71;
    sequence += 1;
    const observedAt = new Date(at).toISOString();
    events.push({ id:`qa-training-friction-${sequence}`, type, observedAt, day:observedAt.slice(0,10), metadata });
  };

  add('workout_target_edited',{kind:'load',method:'stepper'},10);
  add('workout_target_edited',{kind:'load',method:'manual'},10);
  add('workout_target_edited',{kind:'reps',method:'stepper'},9);
  add('workout_target_edited',{kind:'reps',method:'manual'},9);
  add('workout_rest_override',{method:'start_next'},8);
  add('workout_rest_override',{method:'start_next'},8);
  add('workout_rest_override',{method:'start_next'},8);
  add('workout_rest_override',{method:'extend'},7);
  add('workout_session_left',{outcome:'incomplete',source:'navigation',mode:'standard',location:'home'},6);
  add('workout_session_resumed',{outcome:'resumed',source:'navigation',mode:'standard',location:'home'},5);
  add('workout_session_left',{outcome:'incomplete',source:'background',mode:'standard',location:'home'},4);
  add('workout_session_left',{outcome:'incomplete',source:'navigation',mode:'standard',location:'home'},3);

  localStorage.setItem('zero2fit-usage-v1', JSON.stringify({ version:1, events, updatedAt:new Date(now).toISOString() }));
  location.replace('./qa-fuel-fixture.html?page=journey');
})();
</script>
</body>
</html>
