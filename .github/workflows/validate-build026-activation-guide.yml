name: Validate Build 026 Activation Guide

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activation-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Build 026 syntax and wiring
        run: |
          node --check activation-guide-core.mjs
          node --check build026-activation-guide.js
          node --check build026-qa-focus.js
          node --check tools/test-activation-guide-core.mjs
          test -s activation-guide-core.mjs
          test -s build026-activation-guide.js
          test -s build026-qa-focus.js
          test -s build026.css
          test -s tools/test-activation-guide-core.mjs
          grep -q 'acceptance_browser_snapshot' activation-guide-core.mjs
          grep -q 'zero2fit_acceptance_v1' activation-guide-core.mjs
          grep -q 'build026-activation-guide.js' build022-loader.js
          grep -q 'build026-qa-focus.js' build022-loader.js
          grep -q 'zero2fit-shell-v26-activation-guide' sw.js
          grep -q 'activation-guide-core.mjs' sw.js
          grep -q 'build026-activation-guide.js' sw.js
          grep -q 'build026-qa-focus.js' sw.js
          grep -q 'build026.css' sw.js
          grep -q 'Run checks + sync' build026-activation-guide.js
          grep -q 'adaptive_second_browser_confirmed' build026-activation-guide.js
          grep -q 'healthkit_value_parity' build026-activation-guide.js
          grep -q 'page.prepend(panel)' build026-qa-focus.js
          grep -q "capture iphone 393 852 activation" tools/capture-ui-screenshots.sh
          grep -Eq 'Expected [1-9][0-9]* screenshots' tools/capture-ui-screenshots.sh
          if grep -q '#b7f34a\|#070b09' build026.css; then echo 'Build 026 must stay on the clean theme.'; exit 1; fi
          if grep -q 'service_role\|sb_secret_' build026-activation-guide.js activation-guide-core.mjs; then echo 'Build 026 must not use privileged credentials.'; exit 1; fi

      - name: Test activation guide model
        run: node tools/test-activation-guide-core.mjs
