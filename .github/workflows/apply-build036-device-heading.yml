name: Apply Build 036 Devices Heading

on:
  push:
    branches: [ui/modern-overhaul-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/modern-overhaul-20260903
      - name: Align Devices product heading assertion
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/browser-smoke.sh')
          s=p.read_text()
          old="assert_dom 'Your devices, one private timeline'"
          new="assert_dom 'Your devices and private data' 'Build 036 Devices title'"
          if old not in s: raise SystemExit('legacy Devices heading assertion not found')
          p.write_text(s.replace(old,new,1))
      - name: Verify and commit
        run: |
          bash -n tools/browser-smoke.sh
          grep -Fq 'Build 036 Devices title' tools/browser-smoke.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-smoke.sh
          git commit -m 'Align browser smoke with modern Devices title'
          git push origin HEAD:ui/modern-overhaul-20260903
