name: Validate Build 038 UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check syntax and product-shell contract
        run: |
          node --check build038-product-rebuild.js
          node --check tools/test-build038-ui.mjs
          node tools/test-build038-ui.mjs
          test -s build038.css
          grep -q "build038-product-rebuild.js" build022-loader.js
          if grep -q "build036-ui-overhaul.js" build022-loader.js; then
            echo 'Build 038 must replace the Build 036 composition layer.'
            exit 1
          fi
          grep -q "build038.css" sw.js
          grep -q "zero2fit-shell-v38-product-rebuild" sw.js
