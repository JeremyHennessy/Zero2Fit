name: Clear stale Pages deployment lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stale-pages-lock.yml'

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment from Build 004
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_SHA: c9ff83ac4fb1cbfdca5c800452668472ea543084
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_SHA}/cancel"
          code="$(curl --silent --show-error --location \
            --output response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$endpoint")"

          if [[ "$code" == "204" ]]; then
            echo "Canceled stale Pages deployment ${STALE_SHA}."
            exit 0
          fi

          if [[ "$code" == "404" ]]; then
            echo "Stale Pages deployment is already absent; nothing to cancel."
            exit 0
          fi

          echo "Pages cancellation returned HTTP ${code}." >&2
          cat response.txt >&2 || true
          exit 1
