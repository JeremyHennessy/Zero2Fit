name: Diagnose Fuel Save Button

on:
  push:
    branches: [diag/fuel-save-button-20260903]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Run DevTools touch probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          PROFILE="$(mktemp -d)"
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --window-size=430,932 --user-data-dir="$PROFILE" \
            'http://127.0.0.1:4173/qa-fuel-fixture.html?page=nutrition' \
            >/tmp/chrome.out 2>/tmp/chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/targets.json 2>/dev/null && break
            sleep .1
          done
          cat >/tmp/probe.mjs <<'NODE'
          const targets = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target = targets.find(t => t.type === 'page');
          if (!target?.webSocketDebuggerUrl) throw new Error('No page DevTools target.');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          let seq = 0;
          const pending = new Map();
          ws.onmessage = event => {
            const msg = JSON.parse(event.data);
            if (!msg.id) return;
            const p = pending.get(msg.id);
            if (!p) return;
            pending.delete(msg.id);
            msg.error ? p.reject(new Error(JSON.stringify(msg.error))) : p.resolve(msg.result);
          };
          await new Promise((resolve,reject) => { ws.onopen=resolve; ws.onerror=reject; });
          const call = (method, params={}) => new Promise((resolve,reject) => {
            const id = ++seq; pending.set(id,{resolve,reject}); ws.send(JSON.stringify({id,method,params}));
          });
          await call('Runtime.enable');
          await call('Page.enable');
          await new Promise(r => setTimeout(r, 5000));
          const prep = await call('Runtime.evaluate', {
            expression:`(() => {
              const rows=[...document.querySelectorAll('.z17-meal-row')];
              const row=rows.find(node=>node.textContent.includes('Iced latte'));
              const button=row?.querySelector('[data-z17-save]');
              if (!button) return {error:'save-button-missing', rows:rows.map(r=>r.textContent)};
              row.scrollIntoView({block:'center',inline:'nearest'});
              const rect=button.getBoundingClientRect();
              const hit=document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2);
              const state=JSON.parse(localStorage.getItem('zero2fit-fuel-v2')||'{}');
              return {x:rect.left+rect.width/2,y:rect.top+rect.height/2,disabled:button.disabled,hitIsButton:hit===button||button.contains(hit),beforeSaved:(state.savedMeals||[]).length,html:button.outerHTML};
            })()`, returnByValue:true
          });
          const info = prep.result.value;
          console.log('PREP', JSON.stringify(info));
          if (info.error) throw new Error(info.error);
          await call('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:info.x,y:info.y,radiusX:4,radiusY:4,force:1,id:1}]});
          await call('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
          await new Promise(r => setTimeout(r, 500));
          const after = await call('Runtime.evaluate', {
            expression:`(() => {
              const state=JSON.parse(localStorage.getItem('zero2fit-fuel-v2')||'{}');
              const saved=Array.isArray(state.savedMeals)?state.savedMeals:[];
              const row=[...document.querySelectorAll('.z17-meal-row')].find(node=>node.textContent.includes('Iced latte'));
              const button=row?.querySelector('[data-z17-save]');
              return {savedCount:saved.length,hasCoffee:saved.some(item=>item.name==='Iced latte'),buttonDisabled:button?.disabled||false,toast:document.getElementById('toast')?.textContent||''};
            })()`, returnByValue:true
          });
          console.log('AFTER_TOUCH', JSON.stringify(after.result.value));
          if (!after.result.value.hasCoffee) process.exitCode=2;
          ws.close();
          NODE
          node /tmp/probe.mjs
