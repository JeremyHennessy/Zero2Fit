name: Validate Build 022 Photo Sync

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  photo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Build 022 syntax and files
        run: |
          node --check photo-sync-core.mjs
          node --check build022-loader.js
          node --check build022-photo-sync.js
          node --check tools/test-photo-sync.mjs
          test -s photo-sync-core.mjs
          test -s build022-loader.js
          test -s build022-photo-sync.js
          test -s build022.css
          test -s tools/test-photo-sync.mjs
          grep -q 'build022-loader.js' build021-workout-sync.js
          grep -q 'build022-photo-sync.js' build022-loader.js
          grep -q 'zero2fit-shell-v22-photo-sync' sw.js
          grep -q 'photo-sync-core.mjs' sw.js
          grep -q 'build022-loader.js' sw.js
          grep -q 'build022-photo-sync.js' sw.js
          grep -q 'build022.css' sw.js
          grep -q 'progress_photo_sessions' build022-photo-sync.js
          grep -q 'progress_photo_assets' build022-photo-sync.js
          grep -q '/storage/v1/object/authenticated/' build022-photo-sync.js
          grep -q 'prefixes' build022-photo-sync.js
          grep -q 'progress_photo_deleted' photo-sync-core.mjs
          grep -q 'raw_photos_included: false' storage.js
          if grep -q '#b7f34a\|#070b09' build022.css; then echo 'Build 022 must stay on the clean theme.'; exit 1; fi
          if grep -q 'service_role\|sb_secret_' build022-photo-sync.js photo-sync-core.mjs; then echo 'Build 022 must not use privileged credentials.'; exit 1; fi

      - name: Test private progress-photo continuity
        run: node tools/test-photo-sync.mjs
