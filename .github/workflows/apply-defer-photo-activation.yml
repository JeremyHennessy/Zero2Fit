name: Apply Photo Defer Activation Patch

on:
  push:
    branches: [fix/defer-photo-activation-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/defer-photo-activation-gate
      - name: Apply focused activation deferral
        shell: python
        run: |
          from pathlib import Path

          p = Path('build022-photo-sync.js')
          s = p.read_text()
          old = """  const wrapped = async (...args) => {\n    const base = await originalSyncNow(...args);\n    const photos = await syncPhotoContinuity();\n    const result = { ...base, ...photos, synced_at:new Date().toISOString() };\n    localStorage.setItem(LAST_SYNC_KEY, JSON.stringify(result));\n    window.dispatchEvent(new CustomEvent('zero2fit:remote-sync', { detail:result }));\n    return result;\n  };\n"""
          new = """  const wrapped = async (...args) => {\n    const base = await originalSyncNow(...args);\n    let photos;\n    try {\n      photos = { ...(await syncPhotoContinuity()), progress_photo_deferred:false };\n    } catch (error) {\n      photos = {\n        progress_photo_deferred:true,\n        progress_photo_error:String(error?.message || error || 'Progress-photo continuity unavailable')\n      };\n    }\n    const result = { ...base, ...photos, synced_at:new Date().toISOString() };\n    localStorage.setItem(LAST_SYNC_KEY, JSON.stringify(result));\n    window.dispatchEvent(new CustomEvent('zero2fit:remote-sync', { detail:result }));\n    return result;\n  };\n"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'progress_photo_deferred:true' not in s:
              raise SystemExit('Build022 sync wrapper block not found')

          p = Path('build024-private-acceptance.js')
          s = p.read_text()
          s = s.replace("  await waitForPhotoContinuity();\n", "", 1)
          start = s.find("    await check('photo_metadata', 'Progress-photo metadata tables'")
          if start >= 0:
              end = s.find("    await cleanupProbe(rows);", start)
              if end < 0:
                  raise SystemExit('Build024 cleanup marker not found')
              s = s[:start] + "    // Progress-photo metadata and Storage continuity are intentionally deferred during activation.\n\n" + s[end:]
          old_detail = "      return `${Number(syncResult.pulled || 0)} events, ${Number(syncResult.workout_sessions || 0)} workout sessions, ${Number(syncResult.progress_photo_remote_assets || 0)} private photo assets reconciled.`;"
          new_detail = "      return syncResult.progress_photo_deferred\n        ? `${Number(syncResult.pulled || 0)} events and ${Number(syncResult.workout_sessions || 0)} workout sessions reconciled · progress-photo continuity deferred.`\n        : `${Number(syncResult.pulled || 0)} events and ${Number(syncResult.workout_sessions || 0)} workout sessions reconciled.`;"
          if old_detail in s:
              s = s.replace(old_detail, new_detail, 1)
          old_copy = "    <p>This self-test creates uniquely tagged probe rows and one tiny private Storage object, verifies authenticated read/update/delete behavior, cleans the probes, then runs the real Zero2Fit Sync now pipeline. Existing Fuel preferences are restored before the full sync.</p>"
          new_copy = "    <p>This self-test verifies the authenticated account, anonymous blocking, normalized events, preferences and workout continuity, cleans its probe rows, then runs the real Zero2Fit Sync now pipeline. Progress-photo cloud continuity is deferred and does not block activation.</p>"
          if old_copy in s:
              s = s.replace(old_copy, new_copy, 1)
          old_note = "    <small id=\"z24AcceptanceNote\">One-browser infrastructure acceptance only. Run the same account on a second browser later to complete cross-browser acceptance.</small>`;"
          new_note = "    <small id=\"z24AcceptanceNote\">One-browser core infrastructure acceptance only. Progress-photo cloud continuity is deferred; run the same account on a second browser later for the remaining cross-browser checks.</small>`;"
          if old_note in s:
              s = s.replace(old_note, new_note, 1)
          if 'Progress-photo cloud continuity is deferred' not in s:
              raise SystemExit('Build024 deferral copy was not applied')
          p.write_text(s)

          p = Path('activation-guide-core.mjs')
          s = p.read_text()
          photo_step = "    { id:'photo', label:'Photo round-trip + deletion propagated', done:Boolean(cross.photo_round_trip && cross.photo_deletion_propagated), partial:Boolean(cross.photo_round_trip) }\n"
          if photo_step in s:
              s = s.replace(photo_step, "", 1)
          if "id:'photo', label:'Photo round-trip" in s:
              raise SystemExit('Build026 photo activation step remains')
          p.write_text(s)

          p = Path('tools/test-activation-guide-core.mjs')
          s = p.read_text()
          s = s.replace("assert.equal(steps.length,10);", "assert.equal(steps.length,9);", 1)
          s = s.replace("assert.deepEqual(summarizeSteps(steps),{complete:10,partial:0,total:10,done:true});", "assert.deepEqual(summarizeSteps(steps),{complete:9,partial:0,total:9,done:true});", 1)
          p.write_text(s)
      - name: Verify focused patch
        run: |
          node --check build022-photo-sync.js
          node --check build024-private-acceptance.js
          node --check activation-guide-core.mjs
          node tools/test-acceptance-core.mjs
          node tools/test-photo-sync.mjs
          node tools/test-activation-guide-core.mjs
          grep -q 'progress_photo_deferred:true' build022-photo-sync.js
          grep -q 'Progress-photo cloud continuity is deferred' build024-private-acceptance.js
          if grep -q "await check('storage_crud'" build024-private-acceptance.js; then exit 1; fi
          if grep -q "id:'photo'.*Photo round-trip" activation-guide-core.mjs; then exit 1; fi
      - name: Commit production changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build022-photo-sync.js build024-private-acceptance.js activation-guide-core.mjs tools/test-activation-guide-core.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Defer progress-photo continuity from activation gates'
          git push origin HEAD:fix/defer-photo-activation-gate
