name: Validate Build 036 UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check syntax and UI contract
        run: |
          node --check build036-ui-overhaul.js
          node --check tools/test-build036-ui.mjs
          node tools/test-build036-ui.mjs
          test -s build036.css
          grep -q "build036-ui-overhaul.js" build022-loader.js
          grep -q "build036.css" sw.js
