name: Apply Build 036 QA Compatibility

on:
  push:
    branches: [ui/modern-overhaul-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/modern-overhaul-20260903
      - name: Align copy-sensitive QA assertions
        shell: python
        run: |
          from pathlib import Path

          p=Path('tools/browser-smoke.sh')
          s=p.read_text()
          replacements={
            "assert_dom 'Data architecture · Build 003'":"assert_dom 'Health & data' 'Build 036 Devices heading'",
            "assert_dom 'Log once. Reuse what you actually eat.'":"assert_dom 'Today’s nutrition' 'Build 036 Fuel heading'",
            "assert_dom 'Find food without typing the macros.'":"assert_dom 'Find a food' 'Build 036 food-search heading'",
            "assert_dom 'Activation guide · Build 026'":"assert_dom 'id=\"z26ActivationGuide\"' 'Build 026 activation guide'",
            "assert_dom 'Finish real-account and iPhone acceptance.'":"assert_dom 'Finish setup' 'Build 036 activation heading'",
            "assert_dom 'Physical HealthKit evidence · Build 028'":"assert_dom 'id=\"z28HealthKitEvidence\"' 'Build 028 HealthKit evidence'",
            "assert_dom 'Resolve the source before you verify it.'":"assert_dom 'Verify your health sources' 'Build 036 HealthKit heading'",
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'browser-smoke marker not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tools/capture-ui-screenshots.sh')
          s=p.read_text()
          marker='count="$(find "$OUT_DIR" -name \'*.png\' | wc -l)"\n'
          compatibility='# Expected 16 screenshots before Build036; Build036 adds an explicit Add Food interaction capture.\n'
          if compatibility not in s:
            if marker not in s: raise SystemExit('screenshot count marker not found')
            s=s.replace(marker,compatibility+marker,1)
          if 'Expected 17 screenshots' not in s: raise SystemExit('Build036 must retain the 17-screen visual gate')
          p.write_text(s)
      - name: Verify and commit
        run: |
          bash -n tools/browser-smoke.sh
          bash -n tools/capture-ui-screenshots.sh
          grep -Fq 'Build 036 Devices heading' tools/browser-smoke.sh
          grep -Fq 'Expected 16 screenshots before Build036' tools/capture-ui-screenshots.sh
          grep -Fq 'Expected 17 screenshots' tools/capture-ui-screenshots.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-smoke.sh tools/capture-ui-screenshots.sh
          git commit -m 'Align legacy QA with Build 036 product copy'
          git push origin HEAD:ui/modern-overhaul-20260903
