name: Clean Build 015 Review

on:
  push:
    branches: [agent/build-015-adventure-visual]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/build-015-adventure-visual
          fetch-depth: 0
      - name: Remove review-only screenshots and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch qa/build015
          git rm --ignore-unmatch .github/workflows/build015-cleanup.yml .github/workflows/build015-review-gate.yml .github/workflows/build015-wire.yml .github/workflows/build015-polish.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build 015: clean visual review checkpoint'
          git push origin HEAD:agent/build-015-adventure-visual
