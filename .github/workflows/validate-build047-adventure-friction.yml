name: Validate Build 047 Adventure Friction

on:
  pull_request:
    paths:
      - 'usage-core.mjs'
      - 'sw.js'
      - 'qa-adventure-friction-fixture.html'
      - 'tools/test-usage-core.mjs'
      - 'tools/test-build047-adventure-friction.mjs'
      - 'tools/test-build047-adventure-friction-browser.sh'
      - 'tools/browser-smoke.sh'
      - '.github/workflows/validate-build047-adventure-friction.yml'
  push:
    branches: [main]
    paths:
      - 'usage-core.mjs'
      - 'sw.js'
      - 'qa-adventure-friction-fixture.html'
      - 'tools/test-usage-core.mjs'
      - 'tools/test-build047-adventure-friction.mjs'
      - 'tools/test-build047-adventure-friction-browser.sh'
      - 'tools/browser-smoke.sh'
      - '.github/workflows/validate-build047-adventure-friction.yml'

permissions:
  contents: read

jobs:
  adventure-friction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Build 047 syntax
        run: |
          node --check usage-core.mjs
          node --check tools/test-usage-core.mjs
          node --check tools/test-build047-adventure-friction.mjs
          bash -n tools/test-build047-adventure-friction-browser.sh
          bash -n tools/browser-smoke.sh
          test -s qa-adventure-friction-fixture.html
      - name: Test usage model including Adventure friction
        run: node tools/test-usage-core.mjs
      - name: Test Build 047 authority boundary
        run: node tools/test-build047-adventure-friction.mjs
      - name: Test populated Adventure friction signals
        run: bash tools/test-build047-adventure-friction-browser.sh
      - name: Browser smoke full app
        run: bash tools/browser-smoke.sh
