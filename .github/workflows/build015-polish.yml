name: Polish Build 015

on:
  push:
    branches: [agent/build-015-adventure-visual]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/build-015-adventure-visual
          fetch-depth: 0
      - name: Apply presentation-only polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build015-adventure-visual.js')
          text = p.read_text()
          old = "z15SetText('z15FieldRating', `Field rating ${Math.round(Number(caps.rating || 0))}`);"
          new = "z15SetText('z15FieldRating', `Field rating ${Math.round(Number(caps.attack || 0) + Number(caps.defense || 0) + Number(caps.maxHp || 0) / 10)}`);"
          if new not in text:
              if old not in text:
                  raise SystemExit('Build 015 field-rating needle missing')
              p.write_text(text.replace(old, new, 1))
          PY
          node --check build015-adventure-visual.js
          node tools/test-adventure-visual-core.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build015-adventure-visual.js
          git rm --ignore-unmatch .github/workflows/build015-wire.yml .github/workflows/build015-polish.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build 015: finalize Adventure visual presentation'
          git push origin HEAD:agent/build-015-adventure-visual
