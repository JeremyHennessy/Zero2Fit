name: Sync fitness reference data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'
  push:
    branches:
      - main
      - 'build-*'
      - 'agent/build-*'
    paths:
      - 'app.js'
      - 'build002.css'
      - 'training-core.mjs'
      - 'tools/browser-smoke.sh'
      - 'tools/sync-fitness-data.mjs'
      - 'tools/build-training-catalog.mjs'
      - 'tools/normalize-generated-metadata.mjs'
      - 'tools/validate-fitness-data.mjs'
      - 'tools/test-training-planner.mjs'
      - 'data/location_profiles.json'
      - 'data/energy_model.json'
      - 'data/programming_rules.json'
      - 'data/substitution_rules.json'
      - '.github/workflows/sync-fitness-data.yml'

concurrency:
  group: fitness-data-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Check client JavaScript syntax
        run: |
          node --check app.js
          node --check training-core.mjs

      - name: Install PDF text extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and normalize exercise + MET catalogs
        run: node tools/sync-fitness-data.mjs

      - name: Derive apparatus-aware training catalog
        run: node tools/build-training-catalog.mjs

      - name: Remove volatile generated metadata
        run: node tools/normalize-generated-metadata.mjs

      - name: Validate generated fitness data
        run: node tools/validate-fitness-data.mjs

      - name: Test automatic workout planner
        run: node tools/test-training-planner.mjs

      - name: Browser smoke test
        run: bash tools/browser-smoke.sh

      - name: Commit refreshed catalogs when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/generated)" ]; then
            echo 'Generated catalogs are already current.'
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${GITHUB_REF_NAME})" ]; then
            echo 'Branch advanced while this refresh was running; a newer workflow run owns the refresh.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated
          git commit -m 'Data sync: refresh exercise and MET catalogs [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
