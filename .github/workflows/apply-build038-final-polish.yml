name: Apply Build 038 Final Polish

on:
  push:
    branches: [ui/true-redesign-20260903]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/true-redesign-20260903
      - name: Align QA contract and mobile safeguards
        shell: python
        run: |
          from pathlib import Path

          p = Path('tools/browser-smoke.sh')
          s = p.read_text()
          replacements = {
            "assert_dom 'Health &amp; data' 'Build 036 Devices heading'": "assert_dom 'Connected health' 'Build 038 Devices heading'",
            "assert_dom 'Your devices and private data' 'Build 036 Devices title'": "assert_dom 'Your health stack' 'Build 038 Devices title'",
            "assert_dom 'Today’s nutrition' 'Build 036 Fuel heading'": "assert_dom 'id=\"z38AddFood\"' 'Build 038 Add Food action'",
            "assert_dom 'Find a food' 'Build 036 food-search heading'": "assert_dom 'Find food' 'Build 038 food-search heading'",
            "assert_dom 'Finish setup' 'Build 036 activation heading'": "assert_dom 'Finish setup' 'Build 038 activation heading'",
            "assert_dom 'Verify your health sources' 'Build 036 HealthKit heading'": "assert_dom 'Match your real sources' 'Build 038 HealthKit heading'",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing browser-smoke assertion: {old}')
            s = s.replace(old, new, 1)

          anchor = "assert_dom 'z4SensorStrip'\n"
          extra = (
            "assert_dom 'z38-rebuild' 'Build 038 product shell'\n"
            "assert_dom 'id=\"z38TrainStage\"' 'Build 038 workout stage'\n"
            "assert_dom 'id=\"z38FuelSheet\"' 'Build 038 Fuel sheet'\n"
          )
          if extra not in s:
            if anchor not in s:
              raise SystemExit('browser-smoke structural anchor missing')
            s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s)

          p = Path('build038.css')
          css = p.read_text()
          marker = '/* Build 038 mobile interaction safeguards */'
          if marker not in css:
            css += '''\n\n/* Build 038 mobile interaction safeguards */\n@media (max-width:820px) {\n  body.z38-rebuild button,\n  body.z38-rebuild [role="button"],\n  body.z38-rebuild summary { min-height:44px; }\n  body.z38-rebuild input,\n  body.z38-rebuild select,\n  body.z38-rebuild textarea { font-size:16px !important; }\n  body.z38-rebuild .z38-sheet { max-height:min(92dvh,760px); overflow:hidden; }\n  body.z38-rebuild .z38-sheet-body { overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }\n  body.z38-rebuild .z38-sheet header button { min-width:44px; min-height:44px; }\n}\n\n@media (prefers-reduced-motion:reduce) {\n  body.z38-rebuild *,\n  body.z38-rebuild *::before,\n  body.z38-rebuild *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }\n}\n'''
          p.write_text(css)
      - name: Verify and commit
        run: |
          bash -n tools/browser-smoke.sh
          grep -Fq 'Build 038 product shell' tools/browser-smoke.sh
          grep -Fq 'Build 038 mobile interaction safeguards' build038.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-smoke.sh build038.css
          git commit -m 'Align QA and harden Build 038 mobile interactions'
          git push origin HEAD:ui/true-redesign-20260903
