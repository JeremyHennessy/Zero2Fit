name: Validate Zero2Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check training-core.mjs
          node --check tools/build-training-catalog.mjs
          node --check tools/validate-fitness-data.mjs
          node --check tools/test-training-planner.mjs

      - name: Check required static and reference files
        run: |
          test -s index.html
          test -s styles.css
          test -s build002.css
          test -s app.js
          test -s training-core.mjs
          test -s data/generated/training_exercises.json
          test -s data/generated/met_activities.json
          test -s data/generated/met_reconciliation.json
          test -s data/location_profiles.json
          test -s data/programming_rules.json
          test -s data/substitution_rules.json
          test -s data/energy_model.json
          grep -q './styles.css' index.html
          grep -q './app.js' index.html

      - name: Validate generated fitness data
        run: node tools/validate-fitness-data.mjs

      - name: Test automatic workout planner
        run: node tools/test-training-planner.mjs

      - name: Browser smoke test
        run: bash tools/browser-smoke.sh
