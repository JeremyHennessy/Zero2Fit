name: Validate Zero2Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check storage.js
          node --check ingestion.js
          node --check data/exercises.js
          node --check tests/smoke.js

      - name: Run smoke checks
        run: node tests/smoke.js

      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s build-002.css
          test -s app.js
          test -s storage.js
          test -s ingestion.js
          test -s data/exercises.js
          test -s supabase/schema.sql
          grep -q './styles.css' index.html
          grep -q './build-002.css' index.html
          grep -q './data/exercises.js' index.html
          grep -q './storage.js' index.html
          grep -q './ingestion.js' index.html
          grep -q './app.js' index.html

      - name: Reject embedded service credentials
        run: |
          if grep -RniE --exclude='validate.yml' --exclude-dir='.git' '(service[_-]?role|SUPABASE_SERVICE_ROLE|sk-[A-Za-z0-9_-]{20,})' .; then
            echo 'Potential private credential pattern found.'
            exit 1
          fi
