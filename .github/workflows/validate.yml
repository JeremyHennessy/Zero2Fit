name: Validate Zero2Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check training-core.mjs
          node --check adaptive-core.mjs
          node --check intelligence-core.mjs
          node --check workout-execution-core.mjs
          node --check nutrition-core.mjs
          node --check storage.js
          node --check ingestion.js
          node --check build003-integration.js
          node --check device-core.mjs
          node --check build004-integration.js
          node --check adventure-core.mjs
          node --check adventure-visual-core.mjs
          node --check photo-core.mjs
          node --check build007-adventure.js
          node --check build008-photos.js
          node --check zero2fit-config.js
          node --check remote-sync-core.mjs
          node --check remote-sync.js
          node --check build008-device-sync.js
          node --check build009-adaptive.js
          node --check build010-intelligence.js
          node --check build011-adventure.js
          node --check build012-productization.js
          node --check build014-workout-execution.js
          node --check build016-adventure-visual.js
          node --check build017-fuel.js
          node --check sw.js
          node --check tools/build-training-catalog.mjs
          node --check tools/validate-fitness-data.mjs
          node --check tools/test-training-planner.mjs
          node --check tools/test-adaptive-core.mjs
          node --check tools/test-intelligence-core.mjs
          node --check tools/test-workout-execution-core.mjs
          node --check tools/test-nutrition-core.mjs
          node --check tools/test-device-ingestion.mjs
          node --check tools/test-device-driven-progress.mjs
          node --check tools/test-remote-sync.mjs
          node --check tools/test-adventure-core.mjs
          node --check tools/test-adventure-visual-core.mjs
          node --check tools/test-photo-core.mjs
          node --check tools/check-index-contract.mjs
          bash -n tools/capture-ui-screenshots.sh

      - name: Check required static and reference files
        run: |
          test -s index.html
          test -s styles.css
          test -s build002.css
          test -s build003.css
          test -s build004.css
          test -s build006.css
          test -s build007.css
          test -s build012.css
          test -s build014.css
          test -s build016.css
          test -s build017.css
          test -s app.js
          test -s training-core.mjs
          test -s adaptive-core.mjs
          test -s intelligence-core.mjs
          test -s workout-execution-core.mjs
          test -s nutrition-core.mjs
          test -s storage.js
          test -s ingestion.js
          test -s build003-integration.js
          test -s device-core.mjs
          test -s build004-integration.js
          test -s adventure-core.mjs
          test -s adventure-visual-core.mjs
          test -s photo-core.mjs
          test -s build007-adventure.js
          test -s build008-photos.js
          test -s zero2fit-config.js
          test -s remote-sync-core.mjs
          test -s remote-sync.js
          test -s build008-device-sync.js
          test -s build009-adaptive.js
          test -s build010-intelligence.js
          test -s build011-adventure.js
          test -s build012-productization.js
          test -s build014-workout-execution.js
          test -s build016-adventure-visual.js
          test -s build017-fuel.js
          test -s tools/test-adventure-visual-core.mjs
          test -s tools/test-nutrition-core.mjs
          test -s manifest.webmanifest
          test -s sw.js
          test -s assets/z2f-icon-180.png
          test -s assets/z2f-icon-192.png
          test -s assets/z2f-icon-512.png
          test -s tools/capture-ui-screenshots.sh
          test -s ios/Zero2FitHealthBridge/project.yml
          test -s ios/Zero2FitHealthBridge/Zero2FitHealthBridge.entitlements
          test -s ios/Zero2FitHealthBridge/Sources/HealthKitBridge.swift
          test -s ios/Zero2FitHealthBridge/Sources/SupabaseBridgeClient.swift
          test -s data/adventure_catalog.json
          test -s supabase/schema.sql
          test -s data/generated/training_exercises.json
          test -s data/generated/met_activities.json
          test -s data/generated/met_reconciliation.json
          test -s data/location_profiles.json
          test -s data/programming_rules.json
          test -s data/substitution_rules.json
          test -s data/energy_model.json
          grep -q './styles.css' index.html
          grep -q './build006.css' index.html
          grep -q './build007.css' index.html
          grep -q './build012.css' index.html
          grep -Fq "@import url('./build014.css')" build012.css
          grep -q './manifest.webmanifest' index.html
          grep -q 'apple-touch-icon' index.html
          grep -q './zero2fit-config.js' index.html
          grep -q './storage.js' index.html
          grep -q './remote-sync.js' index.html
          grep -q './ingestion.js' index.html
          grep -q './app.js' index.html
          grep -q './build003-integration.js' index.html
          grep -q './build004-integration.js' index.html
          grep -q './build007-adventure.js' index.html
          grep -q './build008-photos.js' index.html
          grep -q './build008-device-sync.js' index.html
          grep -q 'build009-adaptive.js' build008-device-sync.js
          grep -q 'build010-intelligence.js' build009-adaptive.js
          grep -q 'build011-adventure.js' build010-intelligence.js
          grep -q 'build012-productization.js' build011-adventure.js
          grep -q 'build014-workout-execution.js' build012-productization.js
          grep -q 'build016-adventure-visual.js' build012-productization.js
          grep -q 'build017-fuel.js' build016-adventure-visual.js
          grep -q 'workout-execution-core.mjs' build014-workout-execution.js
          grep -q 'zero2fit-shell-v17-fuel' sw.js
          grep -q 'build016-adventure-visual.js' sw.js
          grep -q 'adventure-visual-core.mjs' sw.js
          grep -q 'build017-fuel.js' sw.js
          grep -q 'nutrition-core.mjs' sw.js
          grep -q 'build017.css' sw.js
          grep -Fq 'nav-item[data-page="nutrition"]' build012.css
          grep -q 'serviceWorker.register' build012-productization.js
          grep -q -- '--z15-blue:#3f7df4' build012.css
          grep -q -- '--z15-bg:#f5f7fb' build012.css
          if grep -q '#b7f34a' build016.css; then echo 'Build 016 must not reintroduce the fluorescent lime theme.'; exit 1; fi
          if grep -q '#b7f34a\|#070b09' build017.css; then echo 'Build 017 Fuel must stay on the clean theme.'; exit 1; fi
          grep -q 'zero2fit-fuel-v2' build017-fuel.js
          grep -q 'nutrition_entry' build017-fuel.js
          grep -q 'No target set' build017-fuel.js
          grep -q 'progress_photos' storage.js
          grep -q 'raw_photos_included: false' storage.js
          grep -q 'device_source_observations' supabase/schema.sql
          grep -q 'device_source_verifications' supabase/schema.sql
          grep -q 'source_verification_id' device-core.mjs
          grep -q '"version": 2' data/adventure_catalog.json
          grep -q '"materials"' data/adventure_catalog.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON valid.')"

      - name: Reject embedded private credential patterns
        run: |
          if grep -RniE --exclude='validate.yml' --exclude-dir='.git' '(sk-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]{20,}|sb_secret_[A-Za-z0-9_-]{10,})' .; then
            echo 'Potential private credential value found.'
            exit 1
          fi

      - name: Validate generated fitness data
        run: node tools/validate-fitness-data.mjs

      - name: Test automatic workout planner
        run: node tools/test-training-planner.mjs

      - name: Test adaptive workout engine
        run: node tools/test-adaptive-core.mjs

      - name: Test guided workout execution core
        run: node tools/test-workout-execution-core.mjs

      - name: Test Fuel nutrition core
        run: node tools/test-nutrition-core.mjs

      - name: Test personal intelligence
        run: node tools/test-intelligence-core.mjs

      - name: Test device ingestion
        run: node tools/test-device-ingestion.mjs

      - name: Test device-driven progress
        run: node tools/test-device-driven-progress.mjs

      - name: Test private sync contract
        run: node tools/test-remote-sync.mjs

      - name: Test full RPG adventure engine
        run: node tools/test-adventure-core.mjs

      - name: Test Adventure visual model
        run: node tools/test-adventure-visual-core.mjs

      - name: Test progress-photo helpers
        run: node tools/test-photo-core.mjs

      - name: Check UI compatibility contract
        run: node tools/check-index-contract.mjs

      - name: Browser smoke test
        run: bash tools/browser-smoke.sh
