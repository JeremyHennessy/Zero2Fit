name: Validate Zero2Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q './styles.css' index.html
          grep -q './app.js' index.html
